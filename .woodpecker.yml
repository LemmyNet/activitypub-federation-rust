variables:
  - &rust_image "rust:1.91-bullseye"
  - &rust_nightly_image "rustlang/rust:nightly"
  - &install_binstall "wget -q -O- https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xvz -C /usr/local/cargo/bin"

steps:
  cargo_fmt:
    image: *rust_nightly_image
    commands:
      - rustup component add rustfmt
      - cargo fmt -- --check
    when:
      - event: pull_request

  toml_fmt:
    image: ghcr.io/shaddydc/taplo
    commands:
      - taplo format --check
    when:
      - event: pull_request

  cargo_shear:
    image: *rust_nightly_image
    commands:
      - *install_binstall
      - cargo binstall -y cargo-shear --disable-strategies compile
      - cargo shear --deny-warnings
    when:
      - event: pull_request

  cargo_clippy:
    image: *rust_image
    environment:
      CARGO_HOME: .cargo
    commands:
      - rustup component add clippy
      - cargo clippy --all-targets --all-features
    when:
      - event: pull_request

  cargo_test:
    image: *rust_image
    environment:
      CARGO_HOME: .cargo
    commands:
      - cargo test --all-features --no-fail-fast
    when:
      - event: pull_request

  cargo_doc:
    image: *rust_image
    environment:
      CARGO_HOME: .cargo
    commands:
      - cargo doc --all-features
    when:
      - event: pull_request

  cargo_run_actix_example:
    image: *rust_image
    environment:
      CARGO_HOME: .cargo
    commands:
      - cargo run --example local_federation actix-web
    when:
      - event: pull_request

  cargo_run_axum_example:
    image: *rust_image
    environment:
      CARGO_HOME: .cargo
    commands:
      - cargo run --example local_federation axum
    when:
      - event: pull_request
